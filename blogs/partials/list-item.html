<article class="blog-list-item">
  <div class="blog-list-date">{date}</div>
  <div class="blog-list-body">
    <a href="posts/{slug}.html" class="blog-list-title">{title}</a>
    <p class="blog-list-excerpt">{description}</p>
    <div class="blog-list-tags">
      {tags_html}
    </div>
  </div>
  <a href="posts/{slug}.html" class="blog-list-arrow" aria-label="Read article">
    <i class="fas fa-arrow-right"></i>
  </a>
</article>
